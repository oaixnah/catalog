name: publish-catalog

# catalog.sqlite is the source of truth on main. This workflow:
#   1. computes the next sequence from prod (bumps only when the exported content changed, unless forced) and exports reviewed-registry.json
#   2. signs it (ed25519) into reviewed-registry.signed.json
#   3. force-pushes a prod branch that contains the two JSON files plus logo/ (CDN origin)
# It never writes back to main.
#
# Required repository secret: CATALOG_SIGNING_KEY (PKCS8 ed25519 PEM, raw or base64).

on:
  push:
    branches: [main]
    paths:
      - catalog.sqlite
      - logo/**
  workflow_dispatch:
    inputs:
      bump_sequence:
        description: Force a sequence bump even if the registry content is unchanged
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next sequence
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump_sequence }}
        run: |
          set -euo pipefail

          FORCE_BUMP=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_BUMP" = "true" ]; then
            FORCE_BUMP=true
          fi

          set +e
          git ls-remote --exit-code --heads origin prod >/dev/null
          PROD_STATUS=$?
          set -e

          if [ "$PROD_STATUS" -eq 0 ]; then
            git fetch --no-tags origin +refs/heads/prod:refs/remotes/origin/prod
            if ! git cat-file -e origin/prod:reviewed-registry.json 2>/dev/null; then
              echo "::error::origin/prod exists but reviewed-registry.json is missing"
              exit 1
            fi
            git show origin/prod:reviewed-registry.json > "$RUNNER_TEMP/prod-registry.json"
            BASE=$(python3 -c 'import json,pathlib,sys; print(int(json.loads(pathlib.Path(sys.argv[1]).read_text())["sequence"]))' "$RUNNER_TEMP/prod-registry.json")
            python3 catalog.py export --sequence "$BASE" --out "$RUNNER_TEMP/candidate-registry.json"
            if [ "$FORCE_BUMP" = "true" ] || ! cmp -s "$RUNNER_TEMP/candidate-registry.json" "$RUNNER_TEMP/prod-registry.json"; then
              BUMP=true
            else
              BUMP=false
            fi
          elif [ "$PROD_STATUS" -eq 2 ]; then
            BASE=$(python3 -c "import catalog; c=catalog.connect('catalog.sqlite'); print(int(catalog.latest_registry(c)['sequence']))")
            BUMP=true
          else
            echo "::error::failed to query origin/prod (git ls-remote exit $PROD_STATUS)"
            exit "$PROD_STATUS"
          fi

          if [ "$BUMP" = "true" ]; then
            NEXT=$((BASE + 1))
          else
            NEXT=$BASE
          fi
          echo "sequence base=$BASE bump=$BUMP next=$NEXT"
          echo "NEXT_SEQUENCE=$NEXT" >> "$GITHUB_ENV"

      - name: Export reviewed-registry.json
        run: python3 catalog.py export --sequence "$NEXT_SEQUENCE"

      - name: Sign reviewed-registry.signed.json
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::error::repository secret CATALOG_SIGNING_KEY is not set"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/catalog-signing-key.pem"
          if [[ "$CATALOG_SIGNING_KEY" == -----BEGIN* ]]; then
            printf '%s\n' "$CATALOG_SIGNING_KEY" > "$KEY_FILE"
          else
            printf '%s' "$CATALOG_SIGNING_KEY" | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          python3 catalog.py sign --key "$KEY_FILE"
          rm -f "$KEY_FILE"

      - name: Publish the registry and logos to the prod branch
        run: |
          SEQUENCE=$(python3 -c "import json; print(json.load(open('reviewed-registry.json'))['sequence'])")
          BLOB_JSON=$(git hash-object -w reviewed-registry.json)
          BLOB_SIGNED=$(git hash-object -w reviewed-registry.signed.json)
          if LOGO_TREE=$(git rev-parse HEAD:logo 2>/dev/null); then
            TREE=$(printf '040000 tree %s\tlogo\n100644 blob %s\treviewed-registry.json\n100644 blob %s\treviewed-registry.signed.json\n' "$LOGO_TREE" "$BLOB_JSON" "$BLOB_SIGNED" | git mktree)
          else
            TREE=$(printf '100644 blob %s\treviewed-registry.json\n100644 blob %s\treviewed-registry.signed.json\n' "$BLOB_JSON" "$BLOB_SIGNED" | git mktree)
          fi
          COMMIT=$(git commit-tree "$TREE" -m "publish reviewed registry (sequence $SEQUENCE)")
          git push --force origin "$COMMIT:refs/heads/prod"
          echo "published sequence $SEQUENCE to prod ($COMMIT)"
